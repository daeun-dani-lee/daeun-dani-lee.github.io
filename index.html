<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daeun Lee Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --main:#E0457B; --main-ink:#B8285C; --main-soft:#FCEBF1; --main-line:#F6C9D9;
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#1B1D22; --sub:#5B6170; --mute:#8A90A0; --line:#E6E8EC;
  --radius:18px;
  --surface:#FFFFFF; --text2:var(--text2); --learn-ink:var(--learn-ink); --th:var(--th); --good:var(--good); --bad:#B03030;
  --bar:rgba(255,255,255,.94); --on-main:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --main:#F0679A; --main-ink:#F58AB2; --main-soft:#3A1E2A; --main-line:#6B3149;
  --bg:#141518; --card:#1E2025; --ink:#EEF0F4; --sub:#A9AEBB; --mute:#7F8594; --line:#2F323A;
  --surface:#1E2025; --text2:#CDD1DA; --learn-ink:#F2D9E3; --th:#24262C; --good:#5BC891; --bad:#F07A7A;
  --bar:rgba(30,32,37,.94); --on-main:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --main:#F0679A; --main-ink:#F58AB2; --main-soft:#3A1E2A; --main-line:#6B3149;
  --bg:#141518; --card:#1E2025; --ink:#EEF0F4; --sub:#A9AEBB; --mute:#7F8594; --line:#2F323A;
  --surface:#1E2025; --text2:#CDD1DA; --learn-ink:#F2D9E3; --th:#24262C; --good:#5BC891; --bad:#F07A7A;
  --bar:rgba(30,32,37,.94); --on-main:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:15.5px;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar)}
.topbar-in,.subnav-in,main{padding-left:max(24px,env(safe-area-inset-left,0px))!important;padding-right:max(24px,env(safe-area-inset-right,0px))!important}
@media (max-width:700px){.topbar-in,.subnav-in,main{padding-left:max(16px,env(safe-area-inset-left,0px))!important;padding-right:max(16px,env(safe-area-inset-right,0px))!important}}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
b,strong{font-weight:700}

/* ---------- Top tab bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:0 24px;height:62px}
.logo{font-weight:800;font-size:18px;white-space:nowrap;letter-spacing:-.3px}
.logo span{color:var(--main)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--sub);padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;position:relative}
.tab-btn:hover{background:var(--bg)}
.tab-btn.on{color:var(--main)}
.tab-btn.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-12px;height:3px;border-radius:3px;background:var(--main)}

/* ---------- Sub menu (pills) ---------- */
.subnav{position:sticky;top:calc(62px + env(safe-area-inset-top,0px));z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.subnav-in{max-width:1040px;margin:0 auto;padding:10px 24px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.subnav-in::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--sub);font:inherit;font-size:13.5px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--main-line);color:var(--main-ink)}
.chip.on{background:var(--main);border-color:var(--main);color:var(--on-main)}

/* ---------- Layout ---------- */
main{max-width:1040px;margin:0 auto;padding:28px 24px 80px}
.panel{display:none}
.panel.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hero{background:var(--card);border-radius:var(--radius);padding:34px 36px;border-left:4px solid var(--main);margin-bottom:22px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:1.4px;color:var(--main);text-transform:uppercase;margin-bottom:8px}
.hero h1{font-size:30px;line-height:1.35;letter-spacing:-.6px;font-weight:800;margin-bottom:12px}
.hero h1 em{font-style:normal;color:var(--main)}
.hero p{color:var(--sub);max-width:760px}
.headline{margin-top:18px;display:inline-flex;gap:8px;align-items:flex-start;background:var(--main-soft);color:var(--main-ink);font-weight:700;font-size:14.5px;padding:10px 16px;border-radius:12px}

.card{background:var(--card);border-radius:var(--radius);padding:30px 32px;margin-bottom:20px;scroll-margin-top:130px}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ico{width:46px;height:46px;border-radius:13px;background:var(--main-soft);display:grid;place-items:center;font-size:23px;flex:none}
.sec-title{flex:1;min-width:0}
.sec-title h2{font-size:20px;letter-spacing:-.4px;line-height:1.35;font-weight:800}
.sec-title .period{font-size:13.5px;color:var(--mute);font-weight:500}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--sub);white-space:nowrap}
.badge.hot{background:var(--main);color:var(--on-main)}
.role{font-size:15px;padding:12px 16px;background:var(--bg);border-radius:12px;margin-bottom:18px}
.role b{color:var(--main-ink)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.stat{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .num{font-size:24px;font-weight:800;color:var(--main);letter-spacing:-.5px;line-height:1.25}
.stat .num small{font-size:14px;font-weight:700}
.stat .lbl{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.45}

h3.sub{font-size:14px;font-weight:800;color:var(--ink);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
h3.sub::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--main)}
.card p.txt{color:var(--text2)}
ul.did{list-style:none;display:grid;gap:8px}
ul.did li{position:relative;padding-left:16px;color:var(--text2)}
ul.did li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:2px;background:var(--main)}
ul.did li b{color:var(--ink)}

.learn{margin-top:22px;background:var(--main-soft);border-left:4px solid var(--main);border-radius:0 12px 12px 0;padding:14px 18px}
.learn .t{font-size:12.5px;font-weight:800;color:var(--main-ink);letter-spacing:.5px;margin-bottom:4px}
.learn p{color:var(--learn-ink);font-size:14.8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{font-size:12.5px;font-weight:600;color:var(--main-ink);background:var(--surface);border:1px solid var(--main-line);padding:3px 10px;border-radius:999px}

.note{font-size:12.5px;color:var(--mute);margin-top:6px}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:6px}
table{font-variant-numeric:tabular-nums;width:100%;border-collapse:collapse;font-size:13.8px;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--th);font-weight:700;color:var(--sub);font-size:12.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.up{color:var(--main-ink);font-weight:700}
td.ok{font-weight:700;color:var(--good)}
td.ng{font-weight:700;color:var(--bad)}
tr.hl td{background:var(--main-soft)}

/* highlight figure */
.feature{display:grid;grid-template-columns:220px 1fr;gap:20px;margin-top:10px;align-items:start;background:var(--bg);border-radius:14px;padding:16px}
.feature img{width:100%;border-radius:10px;display:block}
.feature .cap{font-size:12px;color:var(--mute);margin-top:6px}
.feature h4{font-size:15px;margin-bottom:6px}
.feature dl{display:grid;grid-template-columns:80px 1fr;gap:4px 10px;font-size:13.8px}
.feature dt{color:var(--mute);font-weight:600}

/* timeline */
.timeline{position:relative;margin-top:8px;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--main-line)}
.tl{position:relative;padding:0 0 16px}
.tl::before{content:"";position:absolute;left:-21px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--main)}
.tl .when{font-size:12.5px;font-weight:800;color:var(--main)}
.tl .what{font-weight:700}
.tl .desc{font-size:14px;color:var(--sub)}

/* intro */
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tag-row span{background:var(--main);color:var(--on-main);font-weight:700;font-size:13.5px;padding:6px 14px;border-radius:999px}
.profile{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:start}
.avatar{aspect-ratio:1;border-radius:20px;background:linear-gradient(140deg,var(--main) 0%,#F59BB9 100%);display:grid;place-items:center;color:var(--on-main);text-align:center}
.avatar b{font-size:40px;letter-spacing:-1px;display:block;line-height:1.1}
.avatar small{font-size:13px;opacity:.9;font-weight:600}
.kv{display:grid;grid-template-columns:96px 1fr;gap:9px 14px;font-size:14.5px}
.kv dt{color:var(--mute);font-weight:600}
.kv dd b{color:var(--main-ink)}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch}
.step{border:1px solid var(--line);border-radius:16px;padding:20px}
.step .n{font-size:12px;font-weight:800;color:var(--main);letter-spacing:1px}
.step h4{font-size:20px;margin:2px 0 6px;letter-spacing:-.4px}
.step p{font-size:14px;color:var(--sub)}
.step .ex{margin-top:10px;font-size:12.5px;color:var(--main-ink);background:var(--main-soft);border-radius:8px;padding:8px 10px;line-height:1.5}
.arrow{display:grid;place-items:center;color:var(--main);font-size:22px;font-weight:800}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{border:1px solid var(--line);border-radius:16px;padding:18px 20px;cursor:pointer;transition:.15s;background:var(--surface);text-align:left;font:inherit;color:inherit}
.pick:hover{border-color:var(--main);transform:translateY(-2px)}
.pick .k{font-size:12px;font-weight:800;color:var(--main)}
.pick h4{font-size:16.5px;margin:3px 0 4px}
.pick p{font-size:13.8px;color:var(--sub)}

/* summary */
.one-line{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.5}
.one-line em{font-style:normal;color:var(--main)}
.str{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.str .s{border:1px solid var(--line);border-radius:16px;padding:20px}
.str .s .e{font-size:24px}
.str .s h4{font-size:16.5px;margin:6px 0 4px}
.str .s p{font-size:14px;color:var(--sub)}
.str .s .from{font-size:12px;color:var(--main-ink);margin-top:8px;font-weight:600}
.qmark{text-align:center;padding:40px 20px 30px}
.qmark .q{font-size:120px;font-weight:900;color:var(--main);line-height:1}
.qmark h3{font-size:21px;margin-top:14px;letter-spacing:-.4px;line-height:1.5}
.qmark p{color:var(--sub);margin-top:10px;font-size:14.5px}
.contact{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.contact button{font:inherit;cursor:pointer;background:transparent;user-select:text;border:1px solid var(--main);color:var(--main-ink);font-weight:700;font-size:14px;padding:9px 18px;border-radius:999px}
.contact button.fill{background:var(--main);color:var(--on-main)}

.mini{display:grid;gap:10px}
.mini .m{border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.mini .mh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.mini .mh span{font-size:12.5px;color:var(--mute);font-weight:600}
.mini p{font-size:14.3px;color:var(--text2)}
.mini p b{color:var(--main-ink)}
.pick.wide{grid-column:1/-1;border-color:var(--main-line);background:var(--main-soft)}
.hyp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hyp .h{border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.hyp .k{font-size:12px;font-weight:800;color:var(--main)}
.hyp .was{color:var(--mute);text-decoration:line-through;font-size:14px;margin-top:4px}
.hyp .data{font-size:13.5px;color:var(--sub);margin:6px 0}
.hyp .now{font-weight:700;font-size:14.5px}
.bars{display:grid;gap:6px;margin-top:6px}
.bars .b{display:grid;grid-template-columns:42px 1fr 52px;align-items:center;gap:10px;font-size:13px}
.bars .b span{font-weight:700;color:var(--sub)}
.bars .b i{display:block;height:16px;width:var(--w);background:var(--c);border-radius:4px;border:1px solid rgba(0,0,0,.08)}
.bars .b em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.rank{display:grid;gap:10px}
.rank .r{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px}
.rank .r i{display:block;height:12px;width:var(--w);background:var(--main);border-radius:6px}
.rank .r b{text-align:right;font-variant-numeric:tabular-nums;color:var(--main-ink)}
.quote{border-left:3px solid var(--main);padding:8px 14px;margin-top:10px;font-size:14.5px;background:var(--bg);border-radius:0 10px 10px 0}
.quote span{color:var(--mute);font-size:12.5px}
.props{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.props .p{border:1px solid var(--line);border-radius:16px;padding:18px}
.props .k{font-size:12px;font-weight:800;color:var(--main)}
.props h4{font-size:16px;margin:2px 0 8px}
.props ul{padding-left:18px;font-size:13.8px;color:var(--text2);display:grid;gap:4px}
.props .why{margin-top:10px;font-size:12.5px;color:var(--main-ink);background:var(--main-soft);border-radius:8px;padding:6px 10px}
.sgrid{display:grid;grid-template-columns:64px repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.sgrid .col{font-size:12.5px;font-weight:800;color:var(--sub);text-align:center}
.sgrid .lab{font-size:12.5px;font-weight:800;color:var(--sub);display:flex;align-items:center}
.sgrid .cell{min-height:44px;border:1px dashed var(--line);border-radius:10px;display:flex;flex-wrap:wrap;gap:4px;padding:5px;align-content:center;justify-content:center}
.sgrid .cell b{background:var(--c);color:var(--t,#3a2a1c);font-size:12px;padding:5px 8px;border-radius:8px}
@media (max-width:700px){
  .hyp,.props{grid-template-columns:1fr}
  .rank .r{grid-template-columns:1fr 80px}
  .rank .r i{grid-column:1/-1;grid-row:2}
  .sgrid{grid-template-columns:52px repeat(5,minmax(0,1fr));gap:4px}
  .sgrid .cell b{font-size:10.5px;padding:3px 4px}
}
.lang-btn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.lang-btn:hover{border-color:var(--main);color:var(--main-ink)}
footer{
text-align:center;font-size:12.5px;color:var(--mute);padding:10px 0 40px}

@media (max-width:700px){
  body{font-size:15px}
  .topbar-in{padding:0 16px;gap:12px;height:56px}
  .logo{font-size:16px}
  .tab-btn{padding:7px 10px;font-size:14px}
  .tab-btn.on::after{bottom:-10px;left:10px;right:10px}
  .subnav{top:calc(56px + env(safe-area-inset-top,0px))}
  .subnav-in{padding:9px 16px}
  main{padding:18px 16px 60px}
  .hero{padding:24px 20px}
  .hero h1{font-size:23px}
  .card{padding:22px 18px;scroll-margin-top:118px}
  .sec-title h2{font-size:18px}
  .stats{grid-template-columns:1fr 1fr}
  .stat .num{font-size:20px}
  .profile{grid-template-columns:1fr}
  .avatar{max-width:140px}
  .kv{grid-template-columns:78px 1fr;font-size:14px}
  .flow{grid-template-columns:1fr}
  .arrow{transform:rotate(90deg);height:20px}
  .picks,.str{grid-template-columns:1fr}
  .feature{grid-template-columns:1fr}
  .feature img{max-width:240px}
  .one-line{font-size:20px}
  .qmark .q{font-size:90px}
  .qmark h3{font-size:18px}
}
</style>

<!-- =================== 소개 =================== -->

  </div>

  <article class="card sec" id="profile" data-label="프로필">
    <div class="sec-head">
      <div class="ico">🪪</div>
      <div class="sec-title"><h2>기본 프로필</h2><div class="period">2026년 11월 기준</div></div>
      <div class="badges"><span class="badge hot">2027.02 졸업 예정</span></div>
    </div>
    <div class="profile">
      <div class="avatar"><div><b>Dani</b><small>Daeun Lee · 이다은</small></div></div>
      <dl class="kv">

    <h3 class="sub">분석 ② Ulta vs Sally Beauty — 제가 맡은 파트</h3>
    <div class="tbl-wrap"><table>

        <tr><td><b>매출채권회수기간</b><br><span class="note">(매출채권 ÷ 순매출) × 365</span></td><td class="up">7.22일 → 8.72일 (+20.78%)</td><td>3.30일 → 3.14일 (−4.85%)</td><td>Ulta는 매출채권이 매출보다 빠르게 늘어 회수가 느려졌습니다.</td></tr>

        <tr><td><b>현금흐름 프로필</b><br><span class="note">영업 / 투자 / 재무</span></td><td>영업CF $1.34B → $1.50B<br>투자 유출 $0.38B → $0.93B</td><td>영업CF $247M → $275M<br>투자 유출 $109M → $58M</td><td>둘 다 영업현금이 늘었습니다. Ulta는 Space NK 인수 등 확장에 투자했고(Aggressive Growth), Sally는 본사 매각 등으로 부채를 줄였습니다(Financial Optimization).</td></tr>

<section class="panel" id="case">
  <div class="hero">
    <div class="eyebrow">Case Study · Amazon US · Beauty of Joseon</div>
    <h1>Same brand, different bestsellers<br><em>What Amazon US customers buy, and where they walk away</em></h1>
    <p>In November 2026 I collected sales signals, star ratings and reviews for Beauty of Joseon sunscreens on Amazon US. The data made me revise my hypotheses twice, and I turned what I found into merchandising recommendations.</p>
    <div class="headline">💡 Finding: the problem was not shade, but the expectations the listing creates and an unguarded search keyword</div>
  </div>

  <article class="card sec" id="c-start" data-label="Starting point">
    <div class="sec-head">
      <div class="ico">🔍</div>
      <div class="sec-title"><h2>Starting point: Korea and the US had different bestsellers</h2><div class="period">Olive Young (Korea's largest beauty retailer), by popularity vs the brand's Amazon store, Best</div></div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th></th><th>Olive Young (Korea)</th><th>Amazon brand store (US)</th></tr></thead>
      <tbody>
        <tr><td><b>Lead sunscreens</b></td><td>Relief Sun (Rice + Probiotics), tone-up, Aqua-Fresh</td><td>Tinted Mineral Dayscreen in 15 shades, Dayscreen Moisturizer</td></tr>
        <tr><td><b>Label</b></td><td>SPF 50+ PA++++</td><td>Broad Spectrum SPF 30</td></tr>
        <tr><td><b>Selling point</b></td><td>Skincare benefits: soothing, cooling, tone-up</td><td>Shade range, mineral filters</td></tr>
        <tr><td><b>Merchandising</b></td><td>Two-packs, free gifts, character collaborations, exclusives</td><td>Single units</td></tr>
      </tbody>
    </table></div>
    <p class="txt" style="margin-top:14px">The US regulates sunscreen as an over-the-counter drug. Beauty of Joseon shifted its focus to a US-specific line (Dayscreen Moisturizer launched at Sephora in April 2026 for $20), and Relief Sun, its Korean hit, was missing from the official store. The question of this case: <b>how are US customers responding to that change?</b></p>
  </article>

  <article class="card sec" id="c-hypo" data-label="Revised hypotheses">
    <div class="sec-head">
      <div class="ico">🔄</div>
      <div class="sec-title"><h2>The data changed my hypotheses twice</h2><div class="period">First guess → data checked → revised conclusion</div></div>
    </div>
    <div class="hyp">
      <div class="h"><div class="k">Hypothesis 1</div><p class="was">"US bestsellers are deep shades; the brand is targeting an underserved deep-skin market"</p><p class="data">→ Purchases by shade concentrate between 21W and 29N</p><p class="now">The range is wide, but sales sit in medium tones. Deep shades signal "a brand for every skin tone" more than they drive volume</p></div>
      <div class="h"><div class="k">Hypothesis 2</div><p class="was">"Korean shade numbers (23N etc.) make customers pick the wrong shade"</p><p class="data">→ Only 2 reviews chose by Korean number, split 1:1. I then coded all 47 critical reviews</p><p class="now">The main complaint is formula (68%), not shade (40%). The listing calls a heavy, matte product "lightweight"</p></div>
    </div>
  </article>

  <article class="card sec" id="c-shade" data-label="Sales by shade">
    <div class="sec-head">
      <div class="ico">🎨</div>
      <div class="sec-title"><h2>Data 1: units bought last month, by shade</h2><div class="period">Tinted Mineral Dayscreen · Amazon lower bounds · Nov 2026</div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num">11,700<small>+</small></div><div class="lbl">Units bought last month across 13 shades (minimum)</div></div>
      <div class="stat"><div class="num">77<small>%</small></div><div class="lbl">Share in the six light-to-medium shades (15C–29N)</div></div>
      <div class="stat"><div class="num">25W</div><div class="lbl">Best-selling shade (3K+)</div></div>
    </div>
    <div class="bars">
      <div class="b"><span>15C</span><i style="--w:10%;--c:#E4D4C2"></i><em>300+</em></div>
      <div class="b"><span>17N</span><i style="--w:23%;--c:#E8D8C5"></i><em>700+</em></div>
      <div class="b"><span>21W</span><i style="--w:33%;--c:#E1CCB3"></i><em>1K+</em></div>
      <div class="b"><span>23N</span><i style="--w:67%;--c:#DFC7AE"></i><em>2K+</em></div>

      <div class="sec-title"><h2>Data 2: all 47 critical reviews, coded by hand</h2><div class="period">Tinted Mineral Dayscreen · every 1–3 star review · rated 4.0 (242)</div></div>
    </div>
    <div class="rank">
      <div class="r"><span>Heavy · foundation-like · settles into lines and pores</span><i style="--w:68%"></i><b>32 · 68%</b></div>
      <div class="r"><span>Shade (real mismatch 14 + hard to choose 5)</span><i style="--w:40%"></i><b>19 · 40%</b></div>
      <div class="r"><span>Dryness</span><i style="--w:32%"></i><b>15 · 32%</b></div>
      <div class="r"><span>Disappointed vs the old product</span><i style="--w:19%"></i><b>9 · 19%</b></div>

    </div>
    <p class="note">A review with several complaints counts under each. Includes 7 free-product Amazon Vine reviews and 11 reviews from Germany and the UK.</p>
    <h3 class="sub">What I found</h3>
    <ul class="did">
      <li><b>The listing promises something else</b> — The title says "Lightweight · Silky Formula · Natural Finish," but 68% of critical reviews call it heavy and matte. Shoppers with oily skin or who want coverage repeatedly say they are satisfied.</li>
      <li><b>"It's Back!" deepened the disappointment</b> — The brand's search ad suggests the old product has returned. One review: "I was happy to see it come back in tube form. Unfortunately this is not the same product."</li>
      <li><b>The disappointed are existing fans</b> — About 16 critical reviewers say they loved the old product or other Beauty of Joseon products.</li>
      <li><b>Shade complaints point both ways</b> — Too light 5, orange or yellow 6. A single rule like "go one shade darker" will not fix it. Reviews gave sharper clues instead: "the names of the shades don't align with the other product line," "there wasn't a colour guide when I ordered."</li>

    </div>
    <div class="props">
      <div class="p"><div class="k">1 · Reset expectations</div><h4>Make the listing match the product</h4><ul><li>Title and bullets: replace "Lightweight" with <b>medium coverage · matte finish · best for oily/combination skin</b></li><li>Usage tips in text: "apply a thin layer over moisturizer"</li><li>Replace "It's Back!" with <b>"new US formula"</b> to separate it from the old product</li></ul><div class="why">Evidence: 68% of critical reviews cite the formula</div></div>
      <div class="p"><div class="k">2 · Shade information</div><h4>Information, not rules</h4><ul><li>An <b>old-to-new shade conversion table</b>, and fix the existing shade-match tool</li><li>Swatches on several skin tones; photos right after applying and 20 minutes later</li><li>A depth × undertone grid (draft below) to show "the shades next to mine"</li><li>Key guidance as <b>text</b>, not inside images, so AI assistants can read it</li></ul><div class="why">Evidence: 19 shade complaints; "names don't align with the other line"</div></div>
      <div class="p"><div class="k">3 · Keyword defense</div><h4>Win back Relief Sun searchers</h4><ul><li><b>Official ads</b> on "relief sun" and its misspellings</li><li>Report look-alike designs via Brand Registry; consider authenticity programs</li><li>Show the <b>English brand name and how to spot the genuine product</b> prominently</li></ul><div class="why">Evidence: 9 mistaken purchases, 0 satisfied substitutes</div></div>
    </div>

    <h3 class="sub">Analysis 2: Ulta vs Sally Beauty — my part</h3>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Metric (FY2024 → FY2025)</th><th>Ulta Beauty</th><th>Sally Beauty</th><th>My interpretation</th></tr></thead>
      <tbody>
        <tr><td><b>Current ratio</b><br><span class="note">Current assets ÷ current liabilities</span></td><td class="up">1.70 → 1.41 (−17.06%)</td><td>2.20 → 2.26 (+2.73%)</td><td>Ulta's current liabilities grew faster than its current assets, weakening short-term liquidity.</td></tr>
        <tr><td><b>Days sales outstanding</b><br><span class="note">(Receivables ÷ net sales) × 365</span></td><td class="up">7.22 → 8.72 days (+20.78%)</td><td>3.30 → 3.14 days (−4.85%)</td><td>Ulta's receivables grew faster than sales, so collection slowed.</td></tr>
        <tr class="hl"><td><b>Days inventory outstanding</b><br><span class="note">(Inventory ÷ COGS) × 365</span></td><td class="up">103.97 → 105.49 days (+1.46%)</td><td>207.13 → 201.29 days (−2.82%)</td><td>Ulta deliberately built inventory for new brand launches, yet still turns inventory almost twice as fast as Sally.</td></tr>
        <tr><td><b>Cash flow profile</b><br><span class="note">Operating / investing / financing</span></td><td>Operating CF $1.34B → $1.50B<br>Investing outflow $0.38B → $0.93B</td><td>Operating CF $247M → $275M<br>Investing outflow $109M → $58M</td><td>Both grew operating cash. Ulta invested in expansion such as the Space NK acquisition (aggressive growth); Sally cut debt, including by selling its headquarters (financial optimization).</td></tr>
      </tbody>
    </table></div>
    <p class="note">Team: Bo-Jun Huang, Cheng-Chang Hsieh, Daeun Lee / Source: each company's 2025 Annual Report</p>

    <h3 class="sub">Analysis 3: smart-glasses target market — 4 criteria + new targets</h3>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Criterion</th><th>Finding</th><th>Evidence</th></tr></thead>
      <tbody>
        <tr><td><b>Age</b></td><td>25–34, Gen Z</td><td>WSJ (Jun 2026): Gen Z influencers buying camera glasses to film daily life</td></tr>
        <tr><td><b>Race</b></td><td>Likelihood of owning a wearable vs White adults: Black +14%, Hispanic +20%, Asian −18%</td><td>Nagappan et al. (2024), survey of 23,974 US adults (44.5% ownership). Noted the limitation: all wearables, not smart glasses only</td></tr>
        <tr><td><b>Purchase reason</b></td><td>Convenience: music, calls, photos without a phone<br>Productivity: hands-free work in manufacturing, healthcare, logistics</td><td>WSJ (2026), Yahoo Finance market report</td></tr>
        <tr class="hl"><td><b>Region</b></td><td>North America 36.5% share (2025); Asia-Pacific CAGR 11.86% (2026–2035 forecast)</td><td>Yahoo Finance market report</td></tr>
        <tr><td><b>New targets</b></td><td>Healthcare: fastest-growing segment 2026–2035<br>Sports &amp; fitness: sports sunglasses market $3.1B (2019) → $3.4B (2027 forecast)</td><td>Largest segment today is consumer electronics (37.1%, 2025)</td></tr>
      </tbody>
    </table></div>
    <p class="note">Joint research by a team of 3 · individual contributions not separated.</p>

    <div class="learn"><div class="t">What I learned</div><p>I saw firsthand that an ad's effect depends less on what it sells than on who it gives a reason to buy. In finance, I learned that numbers like days inventory outstanding hide merchandising strategy such as new brand launches, which taught me to follow marketing through to the financial results. The target market project was my first experience segmenting a product's customers on several criteria and proposing new targets backed by figures. This program confirmed marketing as my career.</p></div>

      <div class="badges"><span class="badge">Exchange student</span><span class="badge">GPA 4.0</span></div>

    <p class="role"><b>Role —</b> Global Exchange Program student (12 credits)</p>

      <div class="stat"><div class="num">A<small> in all 4</small></div><div class="lbl">12 credits, semester GPA 4.0</div></div>

    <h3 class="sub">Background</h3>
    <p class="txt">Before the exchange I had little confidence speaking English with native speakers. I chose to put myself in an environment where every class and every day happened in English.</p>
    <h3 class="sub">What I did</h3>
    <ul class="did">
      <li><b>Courses beyond my major, in English</b> — Earned an A in all four: Global Perspectives, Sociology of Hip Hop Culture, Public Administration in Society, Social Problems.</li>
      <li><b>Friends from many backgrounds</b> — Learned to understand and communicate with friends of different cultural and racial backgrounds.</li>
      <li><b>Living as a local consumer</b> — Shopped at Amazon, Target, Publix and Costco (see the US shopping field notes in the 🛒 Retail tab).</li>
    </ul>
    <div class="learn"><div class="t">What I learned</div><p>I became confident speaking English, and my communication with native speakers improved noticeably. I learned to understand people through their different cultural and racial backgrounds, and my perspective widened considerably.</p></div>

    <p class="role"><b>Role —</b> Leader of a 4-person team of Korean and international students: ran team communication, planned activities, reported to university staff and wrote activity reports</p>
    <div class="stats">
      <div class="stat"><div class="num">2<small> semesters</small></div><div class="lbl">Team leader two semesters in a row</div></div>

    <h3 class="sub">Background</h3>
    <p class="txt">The program pairs Korean and international students to build friendships and experience Korea together. Team members had different schedules and values, and keeping activities going despite that was the leader's job.</p>
    <h3 class="sub">What I did</h3>
    <ul class="did">
      <li><b>Encouraging participation</b> — Kept members engaged and the team chat active.</li>
      <li><b>Balancing schedules and preferences</b> — Planned activities everyone could join while respecting different schedules and tastes.</li>
      <li><b>Reporting</b> — Reported each activity to university staff and wrote activity reports, connecting staff and members.</li>
      <li><b>Korean and English</b> — Switched between both languages depending on the member.</li>
      <li><b>Introducing Korean culture</b> — Visited a Kim Tschang-Yeul exhibition at the National Museum of Modern and Contemporary Art, tried new Korean dishes, toured the Anguk area, went to a board game café and picnicked in Olympic Park.</li>
    </ul>

        <tr class="hl"><td><b>I split purchases by channel.</b> Non-urgent items that were a hassle to go out for, like adapters and power banks, came from Amazon; daily groceries came from the nearby Target or Publix.</td><td>On Amazon, <b>"buy again when it runs out" items</b> beat "need it now" items. Repeat consumables like K-beauty skincare fit subscriptions and bundles.</td></tr>

<script>
(function(){
  const app=document.getElementById('app');
  const copied={ko:'복사했습니다',en:'Copied'};
  const titles={ko:'이다은 포트폴리오',en:'Daeun Lee Portfolio'};
  let tabs=[],panels=[],subnav=null,observer=null,lock=false,lang='ko';
  function pickLang(){
    try{const q=new URLSearchParams(location.search).get('lang');if(q==='ko'||q==='en')return q;}catch(e){}
    try{const s=localStorage.getItem('portfolio-lang');if(s==='ko'||s==='en')return s;}catch(e){}
    return (navigator.language||'').toLowerCase().startsWith('ko')?'ko':'en';
  }
  function buildSubnav(panel){
    subnav.innerHTML='';
    const secs=[...panel.querySelectorAll('.sec')];
    secs.forEach((s,i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' on':'');b.textContent=s.dataset.label;b.dataset.target=s.id;b.onclick=()=>goSection(s.id);subnav.appendChild(b);});
    if(observer) observer.disconnect();
    observer=new IntersectionObserver(entries=>{if(lock)return;const vis=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(vis.length)setChip(vis[0].target.id);},{rootMargin:'-130px 0px -55% 0px',threshold:0});
    secs.forEach(s=>observer.observe(s));
  }
  function setChip(id){subnav.querySelectorAll('.chip').forEach(c=>{const on=c.dataset.target===id;c.classList.toggle('on',on);if(on)c.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});});}
  function goSection(id){const el=document.getElementById(id);if(!el)return;lock=true;setChip(id);const y=el.getBoundingClientRect().top+window.scrollY-(window.innerWidth<=700?118:130);window.scrollTo({top:y,behavior:'smooth'});setTimeout(()=>lock=false,700);}
  function showTab(name,sec){
    tabs.forEach(t=>t.classList.toggle('on',t.dataset.tab===name));
    panels.forEach(p=>p.classList.toggle('on',p.id===name));
    buildSubnav(document.getElementById(name));
    if(sec){setTimeout(()=>goSection(sec),60);}else window.scrollTo({top:0});
    const t=tabs.find(t=>t.dataset.tab===name);if(t)t.scrollIntoView({block:'nearest',inline:'center'});
    try{history.replaceState(null,'','#'+name);}catch(e){}
  }
  function mount(l,tab){
    lang=l;
    app.innerHTML='';
    app.appendChild(document.getElementById('tpl-'+l).content.cloneNode(true));
    document.documentElement.lang=l;document.title=titles[l];
    tabs=[...app.querySelectorAll('.tab-btn')];panels=[...app.querySelectorAll('.panel')];subnav=document.getElementById('subnav');
    app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const v=b.dataset.copy,o=b.innerHTML;const done=()=>{b.textContent=copied[lang];setTimeout(()=>b.innerHTML=o,1400)};try{navigator.clipboard.writeText(v).then(done,()=>{})}catch(e){}});
    tabs.forEach(t=>t.onclick=()=>showTab(t.dataset.tab));
    app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>showTab(b.dataset.go,b.dataset.sec));
    app.querySelectorAll('[data-lang-switch]').forEach(b=>b.onclick=()=>{const cur=(panels.find(p=>p.classList.contains('on'))||{}).id||'intro';const n=b.dataset.langSwitch;try{localStorage.setItem('portfolio-lang',n)}catch(e){}mount(n,cur);});
    showTab(panels.some(p=>p.id===tab)?tab:'intro');
  }
  window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);const p=panels.find(p=>p.id===h);if(p&&!p.classList.contains('on'))showTab(h);});
  mount(pickLang(),(location.hash||'').slice(1));
})();
</script>
